# Nginx: phục vụ giao diện React + chuyển tiếp /api sang Backend (cùng tên miền → cookie refresh token hoạt động)
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Upload tối đa 10 file × 25MB (giới hạn của multer phía Backend)
  client_max_body_size 260m;

  location /api/ {
    proxy_pass http://api:10000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s; # Tạo ZIP ảnh watermark có thể mất vài giây
  }

  # File build có hash trong tên → cache lâu dài
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: /apartments, /leads, /p/:slug... đều trả về index.html
  location / {
    try_files $uri /index.html;
  }
}
