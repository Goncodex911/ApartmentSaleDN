# Giữ Backend trên Render (gói miễn phí) không "ngủ" — Render tắt service sau ~15 phút không có request,
# làm bot Telegram ngừng nhận tin và request đầu tiên chờ ~50 giây.
# Lưu ý: lịch chạy của GitHub Actions là "cố gắng hết sức", có thể trễ vài phút lúc GitHub quá tải.
# Repo public → GitHub Actions miễn phí không giới hạn phút chạy.
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *" # Mỗi 10 phút (chừa khoảng trễ trước ngưỡng 15 phút của Render)
  workflow_dispatch: # Cho phép bấm chạy tay trong tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health check
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://roommaster-api-0keh.onrender.com/api/v1/health
